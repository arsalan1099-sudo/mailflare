name: Mailflare fork CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Lint, tests and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        id: deps
        run: npm ci
      - name: Generate database migration bundle
        run: npm run db:bundle
      - name: Strict TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node --test tests/*.test.mjs
      - name: Cloudflare Worker build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build
